<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>VibeMol AI connector consent</title>
  <script src="./assets/app/js/connector-adapter.js" defer></script>
</head>
<body>
  <main data-connector-consent data-consent-state="unavailable">
    <h1>VibeMol AI connector</h1>
    <p role="status" data-consent-status>AI connector consent is unavailable.</p>
    <button type="button" data-consent-check hidden>Check for an enabled tab</button>
    <p><a href="./" target="_blank" rel="noopener">Open VibeMol</a></p>
  </main>
</body>
</html>
