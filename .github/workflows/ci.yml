name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements.txt
      - name: Fast checks
        run: make check
      - name: Unit tests
        run: make test-unit

  e2e:
    name: Browser suites (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [smoke, looks, balanced-1, balanced-2, balanced-3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements.txt
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-chromium
      # The install skips cached binaries but still installs Linux dependencies.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Collect assigned browser suites (aggregate gate runs in join)
        run: python tests/e2e/browser_suite.py --shard "${{ matrix.shard }}"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-${{ matrix.shard }}
          path: out/test-artifacts/
          if-no-files-found: error

  browser-gate:
    name: Aggregate browser gate (34/3/37)
    runs-on: ubuntu-latest
    needs: [e2e]
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-suite-*
          path: out/ci/browser-shards
      - name: Verify all suites once, raw failure workflows and aggregate counts
        run: python tests/e2e/join_browser_shards.py --input out/ci/browser-shards
      - name: Upload aggregate browser result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: out/test-artifacts/browser-suite/
          if-no-files-found: ignore

  characterization:
    name: Characterization (${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements.txt
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Capture one full characterization run
        env:
          VIBEMOL_TEST_ARTIFACT_DIR: out/test-artifacts/characterize
        run: python tests/e2e/characterize.py --matrix-run-index "${{ matrix.run }}"
      - name: Upload characterization worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: characterize-${{ matrix.run }}
          path: out/test-artifacts/
          if-no-files-found: error

  characterization-gate:
    name: Exact characterization repeat and goldens
    runs-on: ubuntu-latest
    needs: [characterization]
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: characterize-*
          path: out/ci/characterize
      - name: Compare both artifacts, unchanged goldens and eight identity contexts
        run: python tests/e2e/join_characterize.py --input out/ci/characterize
      - name: Upload joined characterization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: characterization-results
          path: out/test-artifacts/characterize/
          if-no-files-found: ignore

  webkit-properties:
    name: WebKit Properties interactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements.txt
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-webkit
      - name: Install Playwright WebKit
        run: python -m playwright install --with-deps webkit
      - name: WebKit Properties interactions
        run: python tests/e2e/properties_disclosures.py --browser webkit
      - name: Upload WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-properties
          path: out/test-artifacts/
          if-no-files-found: ignore
