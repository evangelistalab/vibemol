name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements.txt
      - name: Fast checks
        run: make check
      - name: Unit tests
        run: make test-unit

  e2e:
    runs-on: ubuntu-latest
    needs:
      - checks-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements.txt
      - name: Install Playwright Chromium and WebKit
        id: browsers
        run: python -m playwright install --with-deps chromium webkit
      - name: Two-run characterization gate
        env:
          VIBEMOL_TEST_ARTIFACT_DIR: out/test-artifacts/characterize
        run: python tests/e2e/characterize.py
      - name: All 37 browser suites (34 passing, three filed defects)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: python tests/e2e/browser_suite.py --allow-known-defects
      - name: WebKit Properties interactions
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: python tests/e2e/properties_disclosures.py --browser webkit
      - name: Upload all E2E results and characterization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: out/test-artifacts/
          if-no-files-found: ignore
