name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements.txt
      - name: Fast checks
        run: make check
      - name: Unit tests
        run: make test-unit

  e2e:
    runs-on: ubuntu-latest
    needs:
      - checks-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: End-to-end smoke tests
        run: make test-e2e
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: out/test-artifacts/
          if-no-files-found: ignore
