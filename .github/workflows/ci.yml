name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements-ci.lock
      - name: Fast checks
        run: make check
      - name: Unit tests
        run: make test-unit
      - name: Install pinned construction-audit tooling
        run: npm install --prefix "$RUNNER_TEMP/construction-audit" --no-save --ignore-scripts @babel/parser@7.24.4 @babel/traverse@7.24.1
      - name: Inverse construction-order gate
        env:
          VIBEMOL_BABEL_ROOT: ${{ runner.temp }}/construction-audit/node_modules/@babel
        run: |
          mkdir -p out/test-artifacts/construction-order
          node tools/audit-construction-order.cjs --self-test
          VIBEMOL_ESCAPE_CONTRACT_REPORT=out/test-artifacts/construction-order/escape-contract.json node tools/check-escape-contract.cjs
          VIBEMOL_COORDINATES_PLACEMENT_REPORT=out/test-artifacts/construction-order/coordinates-placement.json node tools/check-coordinates-placement.cjs
          python tools/check-surface-baseline.py
          node tools/audit-construction-order.cjs tests/baselines/stage5/construction-order.json out/test-artifacts/construction-order/report.json
          PYTHONPATH=tests/e2e python -c 'import json; from pathlib import Path; from ci_evidence import artifact_identity; Path("out/test-artifacts/construction-order/identity.json").write_text(json.dumps(artifact_identity(), indent=2)+"\n")'
      - name: Upload construction-order evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: construction-order
          path: out/test-artifacts/construction-order/
          if-no-files-found: error

  e2e:
    name: Browser suites (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [smoke, looks, balanced-1, balanced-2, balanced-3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements-ci.lock
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-chromium
      # The install skips cached binaries but still installs Linux dependencies.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Shared assertion contract with the real browser
        if: matrix.shard == 'smoke'
        env:
          VIBEMOL_TEST_ARTIFACT_DIR: out/test-artifacts/assertion-contract-probe
        run: python tests/e2e/assertion_contract_probe.py
      - name: Collect assigned browser suites (aggregate gate runs in join)
        run: python tests/e2e/browser_suite.py --shard "${{ matrix.shard }}"
      - name: Raw wait wall-time distributions
        if: always()
        run: python tests/e2e/wall_times.py --root out/test-artifacts --out out/test-artifacts/assertion-wall-times-summary.json
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-${{ matrix.shard }}
          path: out/test-artifacts/
          if-no-files-found: error

  browser-gate:
    name: Aggregate browser gate (37/0/37)
    runs-on: ubuntu-latest
    needs: [e2e]
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-suite-*
          path: out/ci/browser-shards
      - name: Verify all suites once, raw failure workflows and aggregate counts
        run: python tests/e2e/join_browser_shards.py --input out/ci/browser-shards
      - name: Require applicable Stage 5 exporter-defect policy
        run: python tools/check-refactor-run.py --policy tests/baselines/stage5/run-policy.json --browser-result out/test-artifacts/browser-suite/browser-results.json
      - name: Upload aggregate browser result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: out/test-artifacts/browser-suite/
          if-no-files-found: ignore

  characterization:
    name: Characterization (${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements-ci.lock
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Capture one full characterization run
        env:
          VIBEMOL_TEST_ARTIFACT_DIR: out/test-artifacts/characterize
        run: python tests/e2e/characterize.py --matrix-run-index "${{ matrix.run }}"
      - name: Upload characterization worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: characterize-${{ matrix.run }}
          path: out/test-artifacts/
          if-no-files-found: error

  characterization-gate:
    name: Exact characterization repeat and goldens
    runs-on: ubuntu-latest
    needs: [characterization]
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements-ci.lock
      - uses: actions/download-artifact@v4
        with:
          pattern: characterize-*
          path: out/ci/characterize
      - name: Compare both artifacts, unchanged goldens and eight identity contexts
        run: python tests/e2e/join_characterize.py --input out/ci/characterize
      - name: Upload joined characterization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: characterization-results
          path: out/test-artifacts/characterize/
          if-no-files-found: ignore

  webkit-properties:
    name: WebKit Properties interactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements-ci.lock
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-webkit
      - name: Install Playwright WebKit
        run: python -m playwright install --with-deps webkit
      - name: WebKit Properties interactions
        run: python tests/e2e/properties_disclosures.py --browser webkit
      - name: Upload WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-properties
          path: out/test-artifacts/
          if-no-files-found: ignore
