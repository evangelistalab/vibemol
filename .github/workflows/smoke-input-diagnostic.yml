name: Diagnostic Smoke input routing 47 and 48

on:
  push:
    branches: [codex/smoke-region-triage]
    paths:
      - '.github/workflows/smoke-input-diagnostic.yml'
      - 'tests/e2e/smoke_input_diagnostic.py'
      - 'tests/e2e/smoke_input_probe.js'
      - 'tools/diagnostics/instrument_smoke_predicates.cjs'

permissions:
  contents: read

jobs:
  collect:
    name: Input diagnostic (${{ matrix.case }})
    runs-on: ubuntu-latest
    # Existing probe job resource ceiling; no assertion deadline is changed.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: main
            source: 2ac83da1fcc8879302bac06705fe5b869cec37ef
            harness: 2ac83da1fcc8879302bac06705fe5b869cec37ef
            bypass: '--bypass-issue11'
          - case: pr46-product-main-harness
            source: 162a11f57db2efaae7445a9f95f653bdbac4ca78
            harness: 2ac83da1fcc8879302bac06705fe5b869cec37ef
            bypass: '--bypass-issue11'
          - case: pr46-original-harness
            source: 162a11f57db2efaae7445a9f95f653bdbac4ca78
            harness: 162a11f57db2efaae7445a9f95f653bdbac4ca78
            bypass: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare immutable source and original harness
        env:
          SOURCE_REF: ${{ matrix.source }}
          HARNESS_REF: ${{ matrix.harness }}
        run: |
          git fetch --no-tags --depth=1 origin "$SOURCE_REF"
          if [ "$HARNESS_REF" != "$SOURCE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$HARNESS_REF"
          fi
          git worktree add --detach out/input-source "$SOURCE_REF"
          if [ "$HARNESS_REF" = "$SOURCE_REF" ]; then
            echo "HARNESS_ROOT=$GITHUB_WORKSPACE/out/input-source" >> "$GITHUB_ENV"
          else
            echo "HARNESS_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - name: Match the original failing CI runtime
        run: |
          python -m pip install -r api/requirements.txt 'playwright==1.64.0'
          npm install --prefix "$RUNNER_TEMP/input-audit" --no-save --ignore-scripts @babel/parser@7.24.4 @babel/traverse@7.24.1 @babel/generator@7.24.4 @babel/types@7.24.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-1.64.0-chromium
      - name: Install Chromium and operating-system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Collect original assertions, repairs and native input routes
        env:
          SOURCE_REF: ${{ matrix.source }}
          HARNESS_REF: ${{ matrix.harness }}
          DIAGNOSTIC_CASE: ${{ matrix.case }}
          BYPASS_ISSUE11: ${{ matrix.bypass }}
          VIBEMOL_TEST_ARTIFACT_DIR: out/test-artifacts/input-diagnostic
          VIBEMOL_BABEL_ROOT: ${{ runner.temp }}/input-audit/node_modules/@babel
          PYTHONUNBUFFERED: '1'
        run: |
          python tests/e2e/smoke_input_diagnostic.py --source-root out/input-source --harness-root "$HARNESS_ROOT" --source-ref "$SOURCE_REF" --harness-ref "$HARNESS_REF" --case "$DIAGNOSTIC_CASE" --prepare-only
          node tools/diagnostics/instrument_smoke_predicates.cjs "$VIBEMOL_TEST_ARTIFACT_DIR/predicates.json" "$VIBEMOL_TEST_ARTIFACT_DIR/instrumented-predicates.json"
          python tests/e2e/smoke_input_diagnostic.py --source-root out/input-source --harness-root "$HARNESS_ROOT" --source-ref "$SOURCE_REF" --harness-ref "$HARNESS_REF" --case "$DIAGNOSTIC_CASE" $BYPASS_ISSUE11 --reveal-auto-hidden --video-region-only
      - name: Preserve all diagnostic evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: input-diagnostic-${{ matrix.case }}
          path: out/test-artifacts/input-diagnostic/
          if-no-files-found: error
