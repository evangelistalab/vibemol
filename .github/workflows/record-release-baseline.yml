name: Record release characterization baseline

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact authorized 0.10.1 candidate commit (40 hex characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  record:
    if: github.ref == 'refs/heads/codex/release-0-10-1-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        capture: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install ordinary CI's pinned dependencies
        run: pip install -r api/requirements-ci.lock
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-chromium
      - name: Install ordinary CI's browser and Linux dependencies
        run: python -m playwright install --with-deps chromium
      - name: Record the exact candidate twice without injection or a version mapping
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/release-record-pycache
          VIBEMOL_TEST_ARTIFACT_DIR: out/test-artifacts/release-baseline
          VIBEMOL_EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          test "$GITHUB_SHA" = "$VIBEMOL_EXPECTED_SOURCE_COMMIT"
          source_root="$RUNNER_TEMP/release-source"
          mkdir -p "$source_root" "$VIBEMOL_TEST_ARTIFACT_DIR"
          git archive "$VIBEMOL_EXPECTED_SOURCE_COMMIT" | tar -x -C "$source_root"
          python tests/e2e/characterize.py --source-root "$source_root" --record-release-tag v0.10.1 --record-source-commit "$VIBEMOL_EXPECTED_SOURCE_COMMIT" --update-baseline --runs 2
          cp tests/baselines/characterize.json.gz tests/baselines/characterize-summary.json "$VIBEMOL_TEST_ARTIFACT_DIR/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: characterization-baseline-${{ matrix.capture }}
          path: out/test-artifacts/release-baseline/
          if-no-files-found: error

  compare:
    needs: record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/download-artifact@v4
        with:
          pattern: characterization-baseline-*
          path: out/test-artifacts/release-baselines
      - name: Require four exact 102-capture serializations before promotion
        env:
          VIBEMOL_EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: python tests/e2e/compare_ci_baselines.py out/test-artifacts/release-baselines --baseline-ref v0.10.1 --expected-commit "$VIBEMOL_EXPECTED_SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: characterization-ci-comparison
          path: out/test-artifacts/release-baselines/ci-comparison.json
