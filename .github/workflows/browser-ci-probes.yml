name: Issue 4 unbounded state probes

on:
  pull_request:
    paths:
      - '.github/workflows/browser-ci-probes.yml'
      - 'tests/e2e/ci_gate_diagnostics.py'
      - 'tests/e2e/helpers.py'
      - 'tests/e2e/presented_state_probe.py'
      - 'tests/e2e/edit_picking.py'
      - 'tests/e2e/smoke.py'
  workflow_dispatch:
    inputs:
      scope:
        description: Explicit diagnostic; neither supplies ordinary acceptance
        type: choice
        options: [legacy-unbounded, runner-characterization, figure-main-control]
        default: legacy-unbounded

jobs:
  probe:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'legacy-unbounded'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, edit_picking]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install browser dependencies
        run: pip install -r api/requirements-ci.lock && python -m playwright install --with-deps chromium
      - name: Full suite with unbounded real-state wait
        env:
          VIBEMOL_CI_UNBOUNDED_PROBE: '1'
          VIBEMOL_SMOKE_VERBOSE: '1'
          PYTHONUNBUFFERED: '1'
          VIBEMOL_TEST_ARTIFACT_DIR: out/test-artifacts/ci-probe/${{ matrix.suite }}
        run: |
          python tests/e2e/presented_state_probe.py
          python tests/e2e/${{ matrix.suite }}.py
      - name: Upload renderer, state transitions and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue4-${{ matrix.suite }}
          path: out/test-artifacts/ci-probe/

  runner-characterization:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'runner-characterization'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Ordinary locked browser toolchain
        run: pip install -r api/requirements-ci.lock && python -m playwright install --with-deps chromium
      - name: One actual runner and dense-scene characterization
        env:
          VIBEMOL_TEST_ARTIFACT_DIR: out/test-artifacts/runner-characterization
          PYTHONUNBUFFERED: '1'
        run: python tools/diagnostics/runner_characterization.py
      - name: Preserve raw runner, process memory and pressure samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-characterization
          path: out/test-artifacts/runner-characterization/

  figure-main-control:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'figure-main-control'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: main
            ref: b1de909288d8ba85da017f18654771eca54547d0
          - source: pr90
            ref: b7f55e964ed5f1ed7f9fa56728452850f2f4d467
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Ordinary locked browser toolchain
        run: pip install -r api/requirements-ci.lock && python -m playwright install --with-deps chromium
      - name: Three unchanged native Figure matrices per source; diagnostic only
        env:
          PYTHONUNBUFFERED: '1'
          CONTROL_REF: ${{ matrix.ref }}
          CONTROL_SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p out/test-artifacts/figure-main-control
          git rev-parse HEAD HEAD^{tree} > out/test-artifacts/figure-main-control/source.txt
          test "$(git rev-parse HEAD)" = "$CONTROL_REF"
          python - <<'PYCONTROL' > out/test-artifacts/figure-main-control/run.log 2>&1
          import json, pathlib, sys, traceback, os
          import playwright
          from playwright.sync_api import sync_playwright
          sys.path.insert(0, 'tests/e2e')
          from pinned_figure_browser import resolve_pinned_headless_browser
          from figure_runner import run
          out = pathlib.Path('out/test-artifacts/figure-main-control').resolve()
          metadata = pathlib.Path(playwright.__file__).parent/'driver/package/browsers.json'
          pinned = next(r['browserVersion'] for r in json.loads(metadata.read_text())['browsers'] if r['name']=='chromium-headless-shell')
          with sync_playwright() as pw:
              executable = resolve_pinned_headless_browser(pw.chromium.executable_path, pinned, metadata)
          outcomes = []
          for iteration in range(1, 4):
              folder = out / ('native-' + str(iteration))
              try:
                  run(executable, folder)
                  row = dict(iteration=iteration, passed=True)
              except Exception as error:
                  traceback.print_exc()
                  row = dict(iteration=iteration, passed=False, error=str(error))
              row['source'] = os.environ['CONTROL_SOURCE']
              row['commit'] = os.environ['CONTROL_REF']
              row['listingReached'] = (folder/'listing.stderr').exists()
              if row['listingReached']:
                  row['listingStdout'] = (folder/'listing.stdout').read_text()
                  row['listingStderr'] = (folder/'listing.stderr').read_text()
              outcomes.append(row)
              print('[figure-control] ' + json.dumps(row), flush=True)
          (out/'outcomes.json').write_text(json.dumps(outcomes, indent=2))
          print('[figure-control-summary] ' + json.dumps(dict(source=os.environ['CONTROL_SOURCE'], runs=3, passed=sum(r['passed'] for r in outcomes), failed=sum(not r['passed'] for r in outcomes))), flush=True)
          # Fixed additional cohort, declared before execution: 20 fresh CLI
          # listings per source. No repair, retry-to-green or acceptance evidence.
          import subprocess
          job = out/'native-1/listing.json'
          listing_outcomes = []
          for iteration in range(1, 21):
              result = subprocess.run(['node', 'api/figure-runner.mjs', str(job), '--browser', executable, '--list-targets'], capture_output=True, text=True, timeout=360)
              (out/f'listing-{iteration}.stdout').write_text(result.stdout)
              (out/f'listing-{iteration}.stderr').write_text(result.stderr)
              row = dict(source=os.environ['CONTROL_SOURCE'], commit=os.environ['CONTROL_REF'], iteration=iteration, returncode=result.returncode, passed=result.returncode==0)
              listing_outcomes.append(row)
              print('[listing-control] ' + json.dumps(row), flush=True)
          (out/'listing-outcomes.json').write_text(json.dumps(listing_outcomes, indent=2))
          print('[listing-control-summary] ' + json.dumps(dict(source=os.environ['CONTROL_SOURCE'], runs=20, passed=sum(r['passed'] for r in listing_outcomes), failed=sum(not r['passed'] for r in listing_outcomes))), flush=True)
          PYCONTROL
      - name: Preserve main control and every original comparand
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figure-main-control-${{ matrix.source }}
          path: out/test-artifacts/figure-main-control/
