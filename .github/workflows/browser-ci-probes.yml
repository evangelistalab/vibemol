name: Browser diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/browser-ci-probes.yml'
      - 'tests/e2e/ci_gate_diagnostics.py'
      - 'tests/e2e/helpers.py'
      - 'tests/e2e/presented_state_probe.py'
      - 'tests/e2e/edit_picking.py'
      - 'tests/e2e/smoke.py'
  workflow_dispatch:
    inputs:
      scope:
        description: Explicit diagnostic; neither supplies ordinary acceptance
        type: choice
        options: [legacy-unbounded, runner-characterization, browser-performance]
        default: legacy-unbounded
      source_commit:
        description: Exact source commit required for browser-performance only
        required: false
        type: string

jobs:
  probe:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'legacy-unbounded'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, edit_picking]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install browser dependencies
        run: pip install -r api/requirements-ci.lock && python -m playwright install --with-deps chromium
      - name: Full suite with unbounded real-state wait
        env:
          VIBEMOL_CI_UNBOUNDED_PROBE: '1'
          VIBEMOL_SMOKE_VERBOSE: '1'
          PYTHONUNBUFFERED: '1'
          VIBEMOL_TEST_ARTIFACT_DIR: out/test-artifacts/ci-probe/${{ matrix.suite }}
        run: |
          python tests/e2e/presented_state_probe.py
          python tests/e2e/${{ matrix.suite }}.py
      - name: Upload renderer, state transitions and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue4-${{ matrix.suite }}
          path: out/test-artifacts/ci-probe/

  runner-characterization:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'runner-characterization'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Ordinary locked browser toolchain
        run: pip install -r api/requirements-ci.lock && python -m playwright install --with-deps chromium
      - name: One actual runner and dense-scene characterization
        env:
          VIBEMOL_TEST_ARTIFACT_DIR: out/test-artifacts/runner-characterization
          PYTHONUNBUFFERED: '1'
        run: python tools/diagnostics/runner_characterization.py
      - name: Preserve raw runner, process memory and pressure samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-characterization
          path: out/test-artifacts/runner-characterization/

  profile:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'browser-performance'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [looks, look_references]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact source and unchanged production, suites and gate
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          git diff --exit-code c37bb07e30c711025da325a14bbbb4a8345d06d7 HEAD -- assets src index.html tests/e2e tests/baselines
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: pip install -r api/requirements-ci.lock
      - name: Resolve pinned browser version
        id: playwright
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-chromium
      - run: python -m playwright install --with-deps chromium
      - name: Profiler controls and retired-browser self-test
        run: |
          python -m unittest discover -s tests/unit -p test_browser_profiler.py
          python tools/profile_browser_tests.py --suite self-test --out out/test-artifacts/browser-profile/self-test
      - name: Record runner and exact suite
        run: |
          mkdir -p out/test-artifacts/browser-profile
          lscpu > out/test-artifacts/browser-profile/lscpu.txt
          free -b > out/test-artifacts/browser-profile/memory.txt
          git rev-parse HEAD HEAD^{tree} > out/test-artifacts/browser-profile/source.txt
      - name: Profile unchanged suite once; no retries or acceptance
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/browser-profile-pycache
          VIBEMOL_TEST_ARTIFACT_DIR: out/test-artifacts/browser-profile/test-artifacts
        run: python tools/profile_browser_processes.py --suite ${{ matrix.suite }} --out out/test-artifacts/browser-profile/measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-profile-${{ matrix.suite }}
          path: out/test-artifacts/browser-profile/
          if-no-files-found: error
