name: Record characterization baseline on CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  request:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/characterization-portability'
    runs-on: ubuntu-24.04
    outputs:
      record: ${{ steps.request.outputs.record }}
    steps:
      - uses: actions/checkout@v4
      - id: request
        env:
          VIBEMOL_RECORD_BASELINE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          summary = json.loads(pathlib.Path('tests/baselines/characterize-summary.json').read_text())
          recorded_on_ci = summary['baseline'].get('captureProvenance', {}).get('ci', {}).get('provider') == 'GitHub Actions'
          record = os.environ['VIBEMOL_RECORD_BASELINE'] == 'true' or not recorded_on_ci
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'record={str(record).lower()}\n')
          print('Record the tagged base on CI:', record)
          PY

  record:
    needs: request
    if: needs.request.outputs.record == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        capture: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install capture dependencies
        run: |
          pip install -r api/requirements-ci.lock
          python -m playwright install --with-deps chromium
      - name: Capture the tagged base twice without tolerance between repeats
        env:
          VIBEMOL_TEST_ARTIFACT_DIR: out/test-artifacts/ci-baseline
        run: |
          source_root="$RUNNER_TEMP/characterization-base"
          mkdir -p "$source_root" "$VIBEMOL_TEST_ARTIFACT_DIR"
          git archive v0.9.5-pre-refactor | tar -x -C "$source_root"
          python tests/e2e/characterize.py --source-root "$source_root" --inject-harness --update-baseline --runs 2
          cp tests/baselines/characterize.json.gz tests/baselines/characterize-summary.json "$VIBEMOL_TEST_ARTIFACT_DIR/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: characterization-baseline-${{ matrix.capture }}
          path: out/test-artifacts/ci-baseline/
          if-no-files-found: error

  compare:
    needs: record
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/download-artifact@v4
        with:
          pattern: characterization-baseline-*
          path: out/test-artifacts/ci-baselines
      - name: Require identical captures on both independent CI runners
        run: python tests/e2e/compare_ci_baselines.py out/test-artifacts/ci-baselines
      - uses: actions/upload-artifact@v4
        with:
          name: characterization-ci-comparison
          path: out/test-artifacts/ci-baselines/ci-comparison.json
